services:
  editor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8010:8010"
    env_file:
      - ../backend/.env
    volumes:
      - ../backend/data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
