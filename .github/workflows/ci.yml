name: CI · 2711 Editor

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

defaults:
  run:
    working-directory: .

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Ruff lint (backend)
        run: ruff check backend --exclude 'backend/test_*.py'

      - name: Pytest
        env:
          AI_API_KEY: test-key-for-ci
          AI_API_BASE: https://api.example.com
          AI_MODEL: test-model
        run: pytest backend/tests -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dev deps
        run: npm ci || npm install

      - name: Validate assets
        run: npm run validate

      - name: ESLint
        run: npm run lint