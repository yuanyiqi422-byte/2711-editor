<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <meta name="theme-color" content="#a8d8ff" />
  <meta name="color-scheme" content="light" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="2711编辑器 — 您的故事，即刻互动。将文本转化为带分支选择与场景画面的视觉小说，支持 TXT、Word、PDF、EPUB。" />
  <title>2711编辑器 · 2711 Editor</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&family=Outfit:wght@400;500;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <link href="css/tokens.css?v=2" rel="stylesheet" />
  <link href="css/magic-editor.css?v=1" rel="stylesheet" />
  <link href="css/app.css?v=25" rel="stylesheet" />
</head>
<body class="magic-body">
  <a class="skip-link" href="#studio">跳到主内容</a>

  <div class="magic-sparkles" aria-hidden="true"></div>

  <svg class="magic-deco magic-deco--gear magic-deco--gear-1" viewBox="0 0 48 48" aria-hidden="true">
    <circle cx="24" cy="24" r="18" fill="none" stroke="#d4af37" stroke-width="3"/>
    <circle cx="24" cy="24" r="5" fill="#d4af37"/>
    <path d="M24 2v8M24 38v8M2 24h8M38 24h8M7 7l6 6M35 35l6 6M7 41l6-6M35 13l6-6" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round"/>
  </svg>
  <svg class="magic-deco magic-deco--gear magic-deco--gear-2" viewBox="0 0 48 48" aria-hidden="true">
    <circle cx="24" cy="24" r="14" fill="none" stroke="#c9a84c" stroke-width="2.5"/>
    <circle cx="24" cy="24" r="4" fill="#c9a84c"/>
    <path d="M24 6v6M24 36v6M6 24h6M36 24h6" stroke="#c9a84c" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <svg class="magic-deco magic-deco--gear magic-deco--gear-3" viewBox="0 0 48 48" aria-hidden="true">
    <circle cx="24" cy="24" r="16" fill="none" stroke="#e0c060" stroke-width="2.5"/>
    <circle cx="24" cy="24" r="4.5" fill="#e0c060"/>
    <path d="M24 4v7M24 37v7M4 24h7M37 24h7" stroke="#e0c060" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <svg class="magic-deco magic-deco--gear magic-deco--gear-4" viewBox="0 0 48 48" aria-hidden="true">
    <circle cx="24" cy="24" r="12" fill="none" stroke="#d4af37" stroke-width="2"/>
    <circle cx="24" cy="24" r="3.5" fill="#d4af37"/>
    <path d="M24 8v5M24 35v5M8 24h5M35 24h5" stroke="#d4af37" stroke-width="1.8" stroke-linecap="round"/>
  </svg>

  <div id="landing-view" class="magic-page">
    <header class="magic-header" aria-label="2711 编辑器">
      <svg class="magic-header__quill magic-header__quill--left" viewBox="0 0 60 120" aria-hidden="true">
        <path d="M30 5 C20 40 15 70 12 100 L18 108 C22 75 28 45 35 15 Z" fill="#f8a0c8" opacity="0.9"/>
        <path d="M30 5 C38 35 42 65 45 95 L38 102 C35 72 32 42 30 15 Z" fill="#e878a8"/>
        <ellipse cx="15" cy="105" rx="8" ry="4" fill="#5a4020" transform="rotate(-30 15 105)"/>
      </svg>
      <svg class="magic-header__quill magic-header__quill--right" viewBox="0 0 60 120" aria-hidden="true">
        <path d="M30 5 C20 40 15 70 12 100 L18 108 C22 75 28 45 35 15 Z" fill="#6eb5ff" opacity="0.9"/>
        <path d="M30 5 C38 35 42 65 45 95 L38 102 C35 72 32 42 30 15 Z" fill="#4a8fd8"/>
        <ellipse cx="15" cy="105" rx="8" ry="4" fill="#5a4020" transform="rotate(-30 15 105)"/>
      </svg>

      <div class="magic-header__frame">
        <h1 class="magic-header__title-zh" data-brand="name">2711 编辑器</h1>
        <span class="magic-header__title-en" data-brand="nameEnShort">2711 EDITOR</span>
      </div>
      <p class="magic-header__tagline">
        <span class="magic-header__tagline-en">Your Story, Instant Interact</span>
        <span data-brand="tagline">您的故事，即刻生成互动游戏</span>
      </p>
    </header>

    <section class="magic-hero" aria-hidden="true">
      <img
        class="magic-hero__scroll"
        src="images/magic-scroll-hero.png?v=1"
        alt=""
        width="520"
        height="280"
        decoding="async"
      />
      <img
        class="magic-hero__island"
        src="images/floating-island-castle.png?v=1"
        alt=""
        width="480"
        height="320"
        decoding="async"
        loading="lazy"
      />
    </section>

    <section id="create" class="magic-studio" aria-labelledby="studio-title">
      <div id="studio" class="magic-panel">
        <h2 id="studio-title" class="magic-panel__title">2711 编辑器：你的故事，即刻互动</h2>

        <div class="magic-panel__inputs">
          <div class="magic-textarea-wrap">
            <textarea
              id="story-input"
              class="workshop__textarea"
              placeholder="粘贴或填入文本"
              spellcheck="false"
              aria-describedby="workshop-onboard char-count upload-formats"
            ></textarea>
            <svg class="magic-textarea__quill" viewBox="0 0 28 28" aria-hidden="true">
              <path d="M4 24 L8 8 L20 4 L24 16 Z" fill="#8a6840" opacity="0.7"/>
              <path d="M6 22 L10 10" stroke="#5a4020" stroke-width="1.5"/>
            </svg>
          </div>

          <label class="magic-dropzone workshop-btn--upload" id="upload-dropzone" for="file-input">
            <input
              type="file"
              id="file-input"
              accept=".txt,.md,.markdown,.doc,.docx,.pdf,.rtf,.epub,text/plain,application/epub+zip"
              hidden
            />
            <svg class="magic-dropzone__icon" viewBox="0 0 64 64" aria-hidden="true">
              <rect x="8" y="16" width="48" height="36" rx="6" fill="#f8d878" stroke="#d4af37" stroke-width="2"/>
              <path d="M8 28 h48" stroke="#d4af37" stroke-width="2"/>
              <rect x="14" y="8" width="20" height="14" rx="3" fill="#6eb5ff" stroke="#4a8fd8" stroke-width="1.5"/>
              <rect x="30" y="10" width="18" height="12" rx="3" fill="#f8a0c8" stroke="#e878a8" stroke-width="1.5"/>
              <path d="M32 40 l8-10 l6 8 l4-5 l8 12 H20 Z" fill="#9b7fd4" opacity="0.6"/>
            </svg>
            <p class="magic-dropzone__label">上传素材/文件夹<br><span lang="en">Drag &amp; Drop</span></p>
            <p class="magic-dropzone__hint" id="upload-formats">支持 TXT · Word · PDF · EPUB · 最大 50MB</p>
          </label>
        </div>

        <div class="magic-meta">
          <span class="workshop__hint" id="char-count">全文 0 字</span>
        </div>

        <p class="workshop__onboard" id="workshop-onboard">粘贴至少 80 字故事，或上传文件开始创作。</p>
        <p class="workshop__upload-status" id="upload-status" hidden role="status"></p>
        <div class="upload-progress" id="upload-progress" hidden role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="upload-progress__fill" id="upload-progress-fill"></div>
        </div>

        <div class="magic-presets">
          <p class="magic-presets__label">视觉风格</p>
          <div class="preset-row" role="group" aria-label="视觉风格">
            <button type="button" class="preset-btn" data-style="xianxia">
              <span class="preset-btn__name">古风仙侠</span>
              <span class="preset-btn__desc">宗门 · 秘境</span>
            </button>
            <button type="button" class="preset-btn preset-btn--active" data-style="urban_romance">
              <span class="preset-btn__name">都市言情</span>
              <span class="preset-btn__desc">都市 · 多线</span>
            </button>
            <button type="button" class="preset-btn" data-style="mystery">
              <span class="preset-btn__name">悬疑推理</span>
              <span class="preset-btn__desc">线索 · 反转</span>
            </button>
            <button type="button" class="preset-btn" data-style="campus">
              <span class="preset-btn__name">校园青春</span>
              <span class="preset-btn__desc">社团 · 成长</span>
            </button>
          </div>
        </div>

        <div class="magic-actions">
          <button type="button" id="start-btn" class="magic-btn magic-btn--start">开始</button>
          <button type="button" id="create-btn" class="magic-btn magic-btn--generate workshop-btn--create">
            <span class="magic-btn__star" aria-hidden="true">✦</span>
            <span class="btn__label">一键生成互动游戏</span>
            <span class="btn__spinner" hidden aria-hidden="true"></span>
          </button>
          <button type="button" id="load-btn" class="magic-btn magic-btn--load">加载</button>
        </div>

        <section class="pipeline" id="pipeline" hidden>
          <div class="pipeline__head">
            <span class="pipeline__tag">生成进度</span>
            <span class="pipeline__pct" id="pipeline-pct">0%</span>
          </div>
          <div class="pipeline__bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="pipeline__fill" id="pipeline-fill"></div>
          </div>
          <p class="pipeline__msg" id="pipeline-msg">等待开始…</p>
          <div class="pipeline__bible" id="bible-preview" hidden></div>
        </section>

        <p class="workshop__error" id="studio-error" hidden role="alert"></p>
      </div>
    </section>
  </div>

  <!-- 历史记录弹窗 -->
  <div class="magic-modal" id="history-modal" role="dialog" aria-modal="true" aria-labelledby="history-modal-title" hidden>
    <div class="magic-modal__dialog">
      <div class="magic-modal__head">
        <h3 class="magic-modal__title" id="history-modal-title">加载历史记录</h3>
        <button type="button" class="magic-modal__close" id="history-modal-close" aria-label="关闭">×</button>
      </div>
      <div class="magic-modal__body workshop__history">
        <p class="workshop__formats">上传与生成自动保存，可载入文本或直接游玩。</p>
        <ul class="history-list" id="history-list" aria-label="历史记录列表"></ul>
        <p class="history-empty" id="history-empty">暂无记录。上传文件或完成一次转化后，作品将自动保存在此处。</p>
        <p class="history-loading" id="history-loading" hidden role="status">正在加载历史记录…</p>
      </div>
    </div>
  </div>

  <!-- 隐藏 Demo 按钮（供 CreateFlow 绑定） -->
  <button type="button" id="demo-btn" class="magic-hidden" hidden>试玩 Demo</button>
  <button type="button" id="hero-demo-btn" class="magic-hidden" hidden>Demo</button>

  <!-- 橙光式游戏全屏层 -->
  <div id="game" class="game" hidden>
    <div class="vn-stage" id="vn-stage">
      <div class="game__scene-bg" id="scene-bg">
        <div class="game__scene-bg__layer is-active" id="scene-bg-a" aria-hidden="true"></div>
        <div class="game__scene-bg__layer" id="scene-bg-b" aria-hidden="true"></div>
      </div>
      <div class="game__scene-veil"></div>

      <header class="game__hud">
        <button type="button" class="game__back" id="back-studio" title="返回工作室" aria-label="返回工作室">← 返回</button>
        <div class="game__meta">
          <span class="game__style" id="game-style"></span>
          <h2 class="game__title" id="game-title"></h2>
        </div>
        <span class="game__scene-tag" id="scene-tag"></span>
        <button type="button" class="game__replay" id="game-replay" title="从头再玩" aria-label="从头再玩" hidden>↺</button>
      </header>

      <div class="vn-portrait vn-portrait--left" id="portrait-left" aria-hidden="true" hidden></div>
      <div class="vn-portrait vn-portrait--right" id="portrait-right" aria-hidden="true" hidden></div>

      <div class="vn-dialogue" id="vn-dialogue" role="log" aria-live="assertive" aria-atomic="true" aria-relevant="additions text">
        <div class="vn-name" id="speaker">旁白</div>
        <div class="vn-text" id="narrative"></div>
        <div class="vn-continue" id="continue-hint">点击继续 ▸</div>
      </div>

      <div class="vn-choices-panel" id="choices-panel" hidden>
        <p class="vn-choices-label">◆ 请做出选择</p>
        <nav class="vn-choices" id="choices" aria-label="剧情选项"></nav>
      </div>

      <footer class="vn-ending" id="ending-banner" hidden>
        <p class="vn-ending__label" id="ending-label"></p>
        <button type="button" class="workshop-btn workshop-btn--outline" id="restart-btn">再玩一次</button>
      </footer>
    </div>
  </div>

  <script src="js/brand.js?v=7"></script>
  <script src="js/demo.js?v=10"></script>
  <script src="js/scene-images.js?v=5"></script>
  <script src="js/mood.js?v=15"></script>
  <script src="js/game.js?v=14"></script>
  <script src="js/reveal.js?v=7"></script>
  <script src="js/lib/api-errors.js?v=1"></script>
  <script src="js/lib/sse.js?v=1"></script>
  <script src="js/workshop/EditorInput.js?v=2"></script>
  <script src="js/workshop/StylePresets.js?v=1"></script>
  <script src="js/workshop/PipelineView.js?v=1"></script>
  <script src="js/workshop/CreateFlow.js?v=2"></script>
  <script src="js/history.js?v=6"></script>
  <script src="js/workshop/StudioController.js?v=2"></script>
  <script src="js/magic-editor.js?v=1"></script>
  <script src="js/app.js?v=25"></script>
</body>
</html>
