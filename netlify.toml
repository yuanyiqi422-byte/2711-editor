# 2711编辑器 · Netlify 静态前端 + /api 代理到远程 FastAPI

# 构建时在 Netlify 环境变量中设置 API_BACKEND_URL（推荐）或 API_BASE_URL



[build]

  publish = "frontend"

  command = "node scripts/inject-env-config.mjs"



# API 代理由 inject-env-config.mjs 根据 API_BACKEND_URL 生成 frontend/_redirects

# 若未配置后端，上传/解析会失败 — 见 render.yaml 部署 FastAPI



# [injected-api-proxy] — auto-generated by inject-env-config.mjs; do not edit by hand

[[redirects]]

  from = "/api/*"

  to = "https://giant-spiders-fry.loca.lt/api/:splat"

  status = 200

  force = true



[[redirects]]

  from = "/*"

  to = "/index.html"

  status = 200



[[headers]]

  for = "/*"

  [headers.values]

    X-Frame-Options = "SAMEORIGIN"

    X-Content-Type-Options = "nosniff"



[[headers]]

  for = "/css/*"

  [headers.values]

    Cache-Control = "public, max-age=3600"



[[headers]]

  for = "/js/*"

  [headers.values]

    Cache-Control = "public, max-age=3600"



[[headers]]

  for = "/images/*"

  [headers.values]

    Cache-Control = "public, max-age=86400"



[[headers]]

  for = "/audio/*"

  [headers.values]

    Cache-Control = "public, max-age=86400"


