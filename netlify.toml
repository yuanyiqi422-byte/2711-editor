# 2711编辑器 · Netlify 静态前端 + 浏览器直连 Render API（SSE 不可经 Netlify 代理）
# 构建时在 Netlify 环境变量中设置 API_BACKEND_URL（推荐）或 API_BASE_URL

[build]
  publish = "frontend"
  command = "node scripts/inject-env-config.mjs"

# inject-env-config.mjs 会将 API_BACKEND_URL 写入 frontend/js/env-config.js 的 __API_BASE__
# 勿再添加 /api/* → Render 的 rewrite 代理（会截断 SSE 长连接）

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
