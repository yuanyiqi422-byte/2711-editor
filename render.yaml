# Render.com — FastAPI backend for 2711 Editor (free tier web service)
# Deploy: connect repo → Render reads this file → set AI_API_KEY in dashboard
services:
  - type: web
    name: 2711-editor-api
    runtime: docker
    dockerfilePath: docker/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: AI_API_BASE
        value: https://api.deepseek.com
      - key: AI_MODEL
        value: deepseek-chat
      - key: AI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://2711editor.netlify.app,https://2711editor.pages.dev,https://2711editor.pages.dev/
